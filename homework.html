<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework | Study Helper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
        }
        header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            position: sticky;
            top: 0;
            z-index: 999;
        }
        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: #60a5fa;
            text-decoration: none;
        }
        .nav-links a {
            margin: 0 0.6rem;
            text-decoration: none;
            color: #cbd5e1;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }
        .nav-links a:hover {
            color: #60a5fa;
        }
        .nav-links a.active{
            color: #60a5fa;
        }
        .wrap{
            max-width:1100px;
            margin:40px auto;
            padding:0 5%;
        }
        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:16px;
        }
        .top-bar h1{
            font-size:1.8rem;
            color:#fff;
        }
        .add-btn{
            padding:10px 22px;
            background:#3b82f6;
            border:none;
            border-radius:6px;
            color:#fff;
            cursor:pointer;
        }
        .add-btn:hover{
            background:#2563eb;
        }
        .search-box{
            width:100%;
            margin-bottom:30px;
        }
        #searchInput{
            width:100%;
            padding:11px 14px;
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.12);
            border-radius:8px;
            color:#fff;
            font-size:15px;
            outline:none;
        }
        #searchInput:focus{
            border-color:#60a5fa;
        }

        /*弹窗遮罩*/
        .mask{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.6);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:9999;
        }
        .mask.show{display:flex;}
        .form-box{
            width:460px;
            background:#1e293b;
            border:1px solid rgba(255,255,255,0.1);
            border-radius:12px;
            padding:28px;
        }
        .form-box h3{
            margin-bottom:20px;
            color:#fff;
        }
        .item{
            margin-bottom:16px;
        }
        .item label{
            display:block;
            margin-bottom:6px;
            font-size:14px;
            color:#cbd5e1;
        }
        .item input,.item select,.item textarea{
            width:100%;
            padding:9px 12px;
            background:rgba(255,255,255,0.06);
            border:1px solid rgba(255,255,255,0.12);
            border-radius:6px;
            color:#fff;
            outline:none;
        }
        .item select option{
            background:#fff;
            color:#111;
        }
        textarea{
            min-height:90px;
            resize:none;
        }
        .btns{
            display:flex;
            gap:12px;
            margin-top:22px;
        }
        .submit{
            flex:1;
            padding:9px;
            background:#3b82f6;
            border:none;
            border-radius:6px;
            color:white;
            cursor:pointer;
        }
        .cancel{
            flex:1;
            padding:9px;
            background:transparent;
            border:1px solid rgba(255,255,255,0.15);
            border-radius:6px;
            color:#cbd5e1;
            cursor:pointer;
        }
        .radio-group{
            display:flex;gap:20px;margin-top:8px;
        }
        .radio-group label{
            cursor:pointer;
        }

        /*作业列表*/
        .week-title{
            font-size:19px;
            color:#60a5fa;
            margin:36px 0 14px;
            border-left:4px solid #60a5fa;
            padding-left:12px;
        }
        .subject-title{
            font-size:16px;
            color:#93c5fd;
            margin:22px 0 10px;
            padding-left:8px;
        }
        .hw-card{
            background:rgba(255,255,255,0.03);
            border:1px solid rgba(255,255,255,0.07);
            border-radius:10px;
            padding:18px;
            margin-bottom:14px;
            display:flex;
            flex-direction:column;
            gap:12px;
        }
        .hw-top{
            display:flex;
            justify-content:space-between;
            align-items:flex-start;
        }
        .tag-weekday{
            color:#60a5fa;
        }
        .tag-weekend{
            color:#fb923c;
        }
        .hw-content{
            padding:12px 0;
            line-height:1.7;
            color:#e2e8f0;
        }
        .hw-date{
            font-size:13px;
        }
        .date-normal{
            color:#94a3b8;
        }
        .date-warning{
            color:#f87171;
        }
        .date-expire{
            color:#64748b;
            text-decoration:line-through;
        }
        .del-btn{
            padding:5px 10px;
            background:#ef4444;
            border:none;
            border-radius:5px;
            color:#fff;
            font-size:13px;
            cursor:pointer;
        }
        .del-btn:hover{
            background:#dc2626;
        }
        footer {
            text-align: center;
            padding: 3rem 0 2rem;
            color: #64748b;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
<header>
    <a href="index.html" class="logo">Study Helper</a>
    <div class="nav-links">
        <a href="index.html">Post Questions</a>
        <a href="schoolboard.html">School Boards</a>
        <a href="homework.html" class="active">Homework</a>
        <a href="material.html">Materials</a>
        <a href="about.html">About</a>
    </div>
</header>

<div class="wrap">
    <div class="top-bar">
        <h1>All Homework</h1>
        <button class="add-btn" id="openPop">Add New Homework</button>
    </div>
    <!--搜索框-->
    <div class="search-box">
        <input id="searchInput" placeholder="Search subject / content / weekday/weekend / week name...">
    </div>
    <div id="hwList"></div>
</div>

<!--发布作业弹窗-->
<div class="mask" id="mask">
    <div class="form-box">
        <h3>Create New Homework</h3>

        <div class="item">
            <label>Homework Type</label>
            <div class="radio-group">
                <label><input type="radio" name="hwType" value="Weekday" checked> 周内作业</label>
                <label><input type="radio" name="hwType" value="Weekend"> 周末作业</label>
            </div>
        </div>

        <!--托福雅思分类单选-->
        <div class="item">
            <label>Language Category</label>
            <div class="radio-group">
                <label><input type="radio" name="langType" value="None" checked> 非托福雅思</label>
                <label><input type="radio" name="langType" value="TOEFL"> TOEFL</label>
                <label><input type="radio" name="langType" value="IELTS"> IELTS</label>
            </div>
        </div>

        <!--听说读写下拉-->
        <div class="item">
            <label>Module</label>
            <select id="moduleSel">
                <option value="">无模块</option>
                <option>Speaking</option>
                <option>Writing</option>
                <option>Reading</option>
                <option>Listening</option>
            </select>
        </div>

        <div class="item">
            <label>Subject Tag</label>
            <select id="subTag">
                <option>AP Physics 1</option>
                <option>AP Calc AB</option>
                <option>AP Calc BC</option>
                <option>AP Psychology</option>
                <option>AP CSA</option>
                <option>AP Microeconomics</option>
                <option>AP Macroeconomics</option>
                <option>AP Statistics</option>
                <option>AP Art History</option>
                <option>AP Language</option>
                <option>SAT</option>
            </select>
        </div>
        <div class="item">
            <label>Publish Date</label>
            <input type="date" id="pubDate">
        </div>
        <div class="item">
            <label>Due Date(Deadline)</label>
            <input type="date" id="dueDate">
        </div>
        <div class="item">
            <label>Homework Content</label>
            <textarea id="hwContent" placeholder="Write your homework requirement here..."></textarea>
        </div>
        <div class="btns">
            <button class="submit" id="saveBtn">Save</button>
            <button class="cancel" id="closePop">Cancel</button>
        </div>
    </div>
</div>

<footer>
    <p>© 2026 Study Helper. Made for students, by students.</p>
</footer>

<script>
//读取本地
let hwArr = JSON.parse(localStorage.getItem('homeworkData')) || [];
const mask = document.getElementById('mask');
const openPop = document.getElementById('openPop');
const closePop = document.getElementById('closePop');
const saveBtn = document.getElementById('saveBtn');
const listBox = document.getElementById('hwList');
const searchInput = document.getElementById('searchInput');
const langRadios = document.querySelectorAll('input[name="langType"]');
const moduleSel = document.getElementById('moduleSel');
const subTag = document.getElementById('subTag');

//切换禁用逻辑：选中托雅→module启用、subTag禁用；非托雅相反
function changeStatus(){
    let selectLang = document.querySelector('input[name="langType"]:checked').value;
    if(selectLang === 'None'){
        moduleSel.value = '';
        moduleSel.disabled = true;
        subTag.disabled = false;
    }else{
        moduleSel.disabled = false;
        subTag.value = '';
        subTag.disabled = true;
    }
}
langRadios.forEach(item=>item.addEventListener('change',changeStatus));
changeStatus();

// 计算当月第几周
function getMonthWeek(dateStr){
    const d = new Date(dateStr);
    const year = d.getFullYear();
    const month = d.getMonth();
    const firstDay = new Date(year,month,1);
    let offset = (7 - firstDay.getDay() +1) %7;
    let day = d.getDate() + offset;
    let weekNum = Math.ceil(day /7);
    return `${month+1}月第${weekNum}周`;
}

//只保留近两月作业
function filterRecentTwoMonth(arr){
    const now = new Date();
    let twoMonthAgo = new Date();
    twoMonthAgo.setMonth(now.getMonth()-2);
    let valid = arr.filter(item=>{
        let pub = new Date(item.publish);
        return pub >= twoMonthAgo;
    })
    if(valid.length !== arr.length){
        localStorage.setItem('homeworkData',JSON.stringify(valid));
    }
    return valid;
}

//截止日期颜色
function getDueClass(dueStr){
    const today = new Date();
    today.setHours(0,0,0,0);
    const due = new Date(dueStr);
    due.setHours(0,0,0,0);
    const diff = (due - today)/(1000*60*60*24);
    if(diff<0) return 'date-expire';
    if(diff<=3) return 'date-warning';
    return 'date-normal';
}

//打开弹窗初始化重置
openPop.onclick = ()=>{
    mask.classList.add('show');
    let now = new Date().toISOString().split('T')[0];
    document.getElementById('pubDate').value = now;
    document.querySelector('input[name="langType"][value="None"]').checked = true;
    moduleSel.value = '';
    subTag.value = subTag.options[0].value;
    changeStatus();
}
closePop.onclick = ()=> mask.classList.remove('show');

//保存数据
saveBtn.onclick = ()=>{
    const type = document.querySelector('input[name="hwType"]:checked').value;
    const langType = document.querySelector('input[name="langType"]:checked').value;
    const module = moduleSel.value;
    const tag = subTag.value;
    const pub = document.getElementById('pubDate').value;
    const due = document.getElementById('dueDate').value;
    const cnt = document.getElementById('hwContent').value.trim();
    if(!pub || !due || !cnt){
        alert('Fill all information');
        return;
    }
    hwArr.push({
        hwType:type,
        langType:langType,
        module:module,
        subject:tag,
        publish:pub,
        deadline:due,
        content:cnt
    })
    localStorage.setItem('homeworkData',JSON.stringify(hwArr));
    render();
    mask.classList.remove('show');
    document.getElementById('hwContent').value = '';
}

//渲染页面
function render(searchKey=""){
    hwArr = filterRecentTwoMonth(hwArr);
    listBox.innerHTML = '';
    let filterArr = [...hwArr];

    //搜索筛选
    if(searchKey){
        let kw = searchKey.toLowerCase();
        filterArr = filterArr.filter(item=>{
            return item.subject.toLowerCase().includes(kw)
                || item.content.toLowerCase().includes(kw)
                || item.langType.toLowerCase().includes(kw)
                || item.module.toLowerCase().includes(kw)
                || (item.hwType==='Weekday'?'周内':'周末').includes(kw)
                || getMonthWeek(item.publish).includes(kw);
        })
    }

    filterArr.forEach(item=>{
        item.weekMark = getMonthWeek(item.publish);
    })

    let weekList = [...new Set(filterArr.map(i=>i.weekMark))];
    weekList.sort((a,b)=>{
        let getFirstDay=(str)=>{
            let m=parseInt(str);
            return new Date(new Date().getFullYear(),m-1,1);
        }
        return getFirstDay(b)-getFirstDay(a);
    })

    weekList.forEach(week=>{
        let weekAll = filterArr.filter(x=>x.weekMark===week);
        let html = `<h2 class="week-title">${week}</h2>`;
        let subList = [...new Set(weekAll.map(i=>i.subject))];

        subList.forEach(sub=>{
            let subAll = weekAll.filter(x=>x.subject===sub);
            let weekDayArr = subAll.filter(i=>i.hwType==='Weekday');
            let weekEndArr = subAll.filter(i=>i.hwType==='Weekend');
            let sortSub = [...weekDayArr,...weekEndArr];

            html += `<h3 class="subject-title">${sub}</h3>`;
            sortSub.forEach(item=>{
                let realIdx = hwArr.findIndex(o=>
                    o.subject===item.subject && o.publish===item.publish
                    && o.deadline===item.deadline && o.content===item.content
                )
                let typeClass = item.hwType==='Weekday'?'tag-weekday':'tag-weekend';
                let typeText = item.hwType==='Weekday'?'周内作业':'周末作业';
                let dateClass = getDueClass(item.deadline);
                let langLabel = '';
                if(item.langType !== 'None'){
                    langLabel = `【${item.langType} ${item.module}】`;
                }
                html += `
                <div class="hw-card">
                    <div class="hw-top">
                        <span class="${typeClass}">${typeText} ${langLabel}</span>
                        <button class="del-btn" data-index="${realIdx}">Delete</button>
                    </div>
                    <div class="hw-content">${item.content}</div>
                    <div class="hw-date ${dateClass}">Publish:${item.publish} &nbsp;|&nbsp; Deadline:${item.deadline}</div>
                </div>`
            })
        })
        listBox.innerHTML += html;
    })

    //删除绑定
    document.querySelectorAll('.del-btn').forEach(btn=>{
        btn.onclick = function(){
            let i=+this.dataset.index;
            if(confirm('Delete this homework?')){
                hwArr.splice(i,1);
                localStorage.setItem('homeworkData',JSON.stringify(hwArr));
                render(searchInput.value);
            }
        }
    })
}

//实时搜索
searchInput.oninput = e=>{
    render(e.target.value);
}

//初始化渲染
render();
</script>
</body>
</html>
